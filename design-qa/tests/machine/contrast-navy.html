<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>contrast: a real #123456</title>
<style>body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; color: #111; background: #fff; }</style></head><body>
<!-- #123456 (rgb 18, 52, 86) is an ordinary color: as text it passes on white (about 12.8:1), as a background
     and as a control border it is measured like any other color. Expected rows live in run-live-tests.sh. -->
<p style="color:#123456">Navy text passes on white</p>
<div style="background:#123456; color:#333">Gray on navy</div>
<div style="background:#000; padding:8px"><input name="navy" style="border:3px solid #123456; background:#fff"></div>
</body></html>
