<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>overlap pass: hidden text fill</title>
<style>
  body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  .card { width: 320px; padding: 16px; border: 1px solid #ccc; margin-bottom: 16px; }</style></head><body>
<!-- Expected tier is in the file name. data-fail / data-judge on an element = the key of a row the probe must report (row t, or "a | b" for a pair). -->
<div class="card">
<!-- Text with a transparent fill and no background clip is invisible: it overlaps nothing -->
<p style="margin:0; -webkit-text-fill-color:transparent">Ghost copy</p><p style="margin:-12px 0 0">Visible copy</p>
</div>
</body></html>
