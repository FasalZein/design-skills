<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>wrap pass (D6: titles, money and metric labels wrap between words)</title>
<style>
  body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  .card { width: 320px; padding: 16px; border: 1px solid #ccc; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }</style></head><body>
<!-- Expected tier is in the file name. data-fail / data-judge on an element = the key of a row the probe must report (row t, or "a | b" for a pair). -->
<h1 style="width:120px; font-size:24px">Revenue $12.0M</h1>
<div class="card"><div style="width:70px">$12.0M – $18.0M</div></div>
</body></html>
