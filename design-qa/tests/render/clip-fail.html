<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>clip fail</title>
<style>
  body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  .card { width: 320px; padding: 16px; border: 1px solid #ccc; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .narrow { width: 80px; }</style></head><body>
<!-- Expected tier is in the file name. data-fail / data-judge on an element = the key of a row the probe must report (row t, or "a | b" for a pair). -->
<h1 class="truncate" style="width:200px" data-fail="A systematic engine designed to monetize" data-why="title, money or metric truncated">A systematic engine designed to monetize volatility</h1>
<div class="card"><span class="truncate narrow" style="display:block" title="$12.0M – $18.0M" data-fail="$12.0M – $18.0M" data-why="title, money or metric truncated">$12.0M – $18.0M</span>
  <div class="narrow" style="overflow:hidden; white-space:nowrap" data-fail="Milestone cut hard" data-why="cut without ellipsis">Milestone cut hard</div>
  <div class="truncate narrow" data-fail="Islamic Investors Fund" data-why="truncated, full value unreachable">Islamic Investors Fund</div>
  <div class="narrow" style="white-space:nowrap" data-fail="Spills out of the box" data-why="spills out of its box">Spills out of the box</div></div>
<!-- whole lines clamped away: no line shows in part, the box itself still cuts its own text -->
<p style="display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; width:200px; line-height:24px; margin:0" data-fail="Quarterly review notes that run on for s" data-why="truncated, full value unreachable">Quarterly review notes that run on for several lines past the clamp and hide the rest of the sentence</p>
</body></html>
