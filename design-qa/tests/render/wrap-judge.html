<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>wrap judge (a label wraps)</title>
<style>
  body { margin: 24px; font: 16px/1.5 system-ui, sans-serif; color: #1a1a1a; background: #fff; }
  .card { width: 320px; padding: 16px; border: 1px solid #ccc; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; }
</style></head><body>
<!-- Expected tier is in the file name. Elements marked data-expect="fail" are the rows the probe must report as FAIL. -->
<div class="card"><label style="display:block; width:60px">Session type</label><input aria-label="Session type"></div>
</body></html>
